# Balanceador local no lugar do ALB: distribui cada requisição entre as réplicas ativas.
# Os nomes são resolvidos pelo DNS do Docker a cada 2 s: uma réplica parada some do DNS e sai do
# balanceamento, como um alvo retirado do target group. Requer nginx >= 1.27.3 (`resolve` no upstream).
resolver 127.0.0.11 valid=2s ipv6=off;

upstream api {
    zone api 64k;
    server api-1:8000 resolve max_fails=1 fail_timeout=5s;
    server api-2:8000 resolve max_fails=1 fail_timeout=5s;
    server api-3:8000 resolve max_fails=1 fail_timeout=5s;
    keepalive 32;
}

server {
    listen 80;

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 120s;
        # Diferente do ALB, este nginx não tem health check ativo e pode tentar uma réplica que acabou
        # de parar ou que ainda não abriu a porta. Só nesses erros de conexão o pedido vai para outra
        # réplica; respostas lentas ou com erro da API nunca são repetidas.
        proxy_next_upstream error;
        proxy_next_upstream_tries 2;
    }
}
