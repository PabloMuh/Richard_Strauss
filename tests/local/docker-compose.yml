# Ambiente local para validar o script k6 e a análise, sem AWS.
# Três réplicas da API com os limites da task Fargate (0,25 vCPU, 512 MiB) atrás de um nginx
# que faz o papel do ALB. Não há Auto Scaling local: o número de réplicas ativas é controlado
# pelo Invoke-Experiment.ps1 -Local (1 na calibração e no baseline, 3 em B/C, 2 em D).
#
#   docker compose -f tests/local/docker-compose.yml up -d --build --wait
#   docker compose -f tests/local/docker-compose.yml down
name: rs-local

x-api: &api
  image: rs-api:local
  pull_policy: never # imagem construída localmente pela api-1
  cpus: 0.25
  mem_limit: 512m
  # Mesmo comando e timeout do health check da task definition (o do Dockerfile é mais pesado).
  healthcheck:
    test: ["CMD", "python", "-S", "-c", 'import socket,sys; s=socket.create_connection((''127.0.0.1'',8000),4); s.sendall(b''GET /health HTTP/1.0\r\n\r\n''); sys.exit(0 if s.makefile(''rb'').readline().split()[1:2]==[b''200''] else 1)']
    interval: 10s
    timeout: 10s
    retries: 3
    start_period: 30s
    start_interval: 2s

services:
  api-1:
    <<: *api
    build: { context: ../../app, args: { APP_VERSION: local } }
    environment: { INSTANCE_ID: local-1 }
  api-2:
    <<: *api
    environment: { INSTANCE_ID: local-2 }
  api-3:
    <<: *api
    environment: { INSTANCE_ID: local-3 }
  lb:
    image: nginx:1.27-alpine
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["8080:80"]
    depends_on:
      api-1: { condition: service_healthy }
      api-2: { condition: service_healthy }
      api-3: { condition: service_healthy }
